name: 🚀 신규 큐 데뷔 게시 (1회성)

# 트렌드 스카우트 채택안(컴백 캘린더 + 상식 등급전) 첫 게시용 원샷.
# 이 파일이 push 되면 1회 실행 — 두 포맷 모두 ledger 멱등이라 재실행돼도
# 중복 게시 없음. 이후 정기 편성은 engagement.yml 이 담당
# (퀴즈: 매주 금 11:30 / 캘린더: 매월 1일 + 데이터 갱신 시).
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post_new_queue_now.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: engagement-daily   # 정기 engagement 와 동시 실행 방지
  cancel-in-progress: false

jobs:
  debut:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install fonts + ffmpeg + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg unzip
          mkdir -p /tmp/pretendard
          curl -fsSL -o /tmp/pretendard.zip \
            https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip
          unzip -q -o /tmp/pretendard.zip -d /tmp/pretendard
          sudo mkdir -p /usr/share/fonts/opentype/pretendard
          sudo cp /tmp/pretendard/public/static/*.otf /usr/share/fonts/opentype/pretendard/ || true
          sudo fc-cache -f
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Post calendar + quiz
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/engagement_daily.py --format calendar
          sleep 90   # 게시 간 간격 (연속 게시 봇 패턴 완화)
          python scripts/engagement_daily.py --format quiz

      - name: Commit ledger
        run: |
          if git diff --quiet post_ledger.json 2>/dev/null; then
            echo "ledger 변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post_ledger.json
          git commit -m "engagement: 신규 큐 데뷔 $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 자동 게시 실패: 신규 큐 데뷔"
          BODY="[실행 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 확인 필요."
          gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" || true
