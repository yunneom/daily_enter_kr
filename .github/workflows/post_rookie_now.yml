name: 🌱 신인 걸그룹 랭킹 게시 (원샷)

# 신인 걸그룹 브랜드평판 카운트다운(run_rookie) 첫 게시용 원샷.
# 이 파일이 push 되면 1회 실행 — topic_id(period) 멱등이라 재실행돼도 중복 게시
# 없음. 이후 월간 편성은 engagement.yml 이 담당 (매월 2일, 데이터 갱신 시).
# 순서: 그룹 단체사진 캐시 워밍(커먼즈, GHA 네트워크) → 캐시 커밋 → 게시.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post_rookie_now.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '렌더만 하고 게시 안 함'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: engagement-daily   # 정기 engagement 와 동시 실행 방지
  cancel-in-progress: false

jobs:
  rookie:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install fonts + ffmpeg + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg unzip
          mkdir -p /tmp/pretendard
          curl -fsSL -o /tmp/pretendard.zip \
            https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip
          unzip -q -o /tmp/pretendard.zip -d /tmp/pretendard
          sudo mkdir -p /usr/share/fonts/opentype/pretendard
          sudo cp /tmp/pretendard/public/static/*.otf /usr/share/fonts/opentype/pretendard/ || true
          sudo fc-cache -f
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Warm group photo cache (Commons)
        env:
          IDOL_PHOTO_GAP_SEC: '8'
        run: python scripts/warm_group_photo_cache.py

      - name: Commit group photo cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/group_photos
          if git diff --cached --quiet; then
            echo "그룹 사진 캐시 변경 없음"
          else
            git commit -m "assets: 신인 그룹 단체사진 캐시 워밍 [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Post rookie ranking
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/engagement_daily.py --format rookie --dry-run
          else
            python scripts/engagement_daily.py --format rookie
          fi

      - name: Commit ledger
        run: |
          if git diff --quiet post_ledger.json 2>/dev/null; then
            echo "ledger 변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post_ledger.json
          git commit -m "engagement: 신인 걸그룹 랭킹 게시 $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 자동 게시 실패: 신인 걸그룹 랭킹"
          BODY="[실행 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 확인 필요. 단체 실사 미확보가 원인이면 data/rookie_group_photos.json 큐레이션을 보강한 뒤 재실행하세요."
          gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" || true