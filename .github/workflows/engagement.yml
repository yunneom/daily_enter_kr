name: 🎯 참여형 데일리 (요일 로테이션)

# 요일 로테이션: 월 유닛빌더 / 화·금 밸런스게임 / 수·토 퍼즈챌린지 /
# 목 케미투표 / 일 케미결과 (+ 매월 15일 브랜드평판 카운트다운 추가)
# 매일 11:30 KST — 뉴스(08:00~08:30)·운세(11:00)와 간격 확보.
on:
  schedule:
    - cron: '30 2 * * *'   # UTC 02:30 = KST 11:30
  workflow_dispatch:
    inputs:
      format:
        description: '포맷 강제 (비우면 요일 자동)'
        required: false
        type: choice
        options: ['', 'balance', 'pause', 'unit', 'chemi', 'chemi_result', 'brandrep']
      dry_run:
        description: 'dry-run (렌더만)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: engagement-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install fonts (Pretendard) + ffmpeg + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg unzip
          mkdir -p /tmp/pretendard
          curl -fsSL -o /tmp/pretendard.zip \
            https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip
          unzip -q -o /tmp/pretendard.zip -d /tmp/pretendard
          sudo mkdir -p /usr/share/fonts/opentype/pretendard
          sudo cp /tmp/pretendard/public/static/*.otf /usr/share/fonts/opentype/pretendard/ || true
          sudo fc-cache -f
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Run engagement post
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.format }}" ]; then ARGS="--format ${{ inputs.format }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/engagement_daily.py $ARGS

      - name: Commit ledger
        if: ${{ inputs.dry_run != true }}
        run: |
          if git diff --quiet post_ledger.json 2>/dev/null; then
            echo "ledger 변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post_ledger.json
          git commit -m "engagement: $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload cards artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engagement-${{ github.run_number }}
          path: output_enter/publish/engagement/
          retention-days: 7
          if-no-files-found: ignore

      # 실패 시 GitHub 이슈로 알림 — Discord 미설정 상태에서 5일 무감지
      # 재발 방지 (2026-07 토큰 만료 사고). 열린 알림 이슈가 있으면 댓글만.
      - name: Alert on failure (GitHub issue)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 자동 게시 실패: engagement"
          BODY="워크플로우 [실행 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 확인 필요. 토큰 만료라면 exchange_token.py 재발급 후 INSTAGRAM_ACCESS_TOKEN 시크릿 업데이트."
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$(date -u '+%Y-%m-%d %H:%M UTC') 또 실패 — $BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
