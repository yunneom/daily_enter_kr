name: 💡 주간 트렌드 스카우트

# 매주 월요일 10:00 KST — Claude 웹서치로 걸그룹 숏폼 트렌드를 조사해
# 신규 콘텐츠 큐 후보를 GitHub 이슈로 제안한다. 자동 게시는 하지 않음 —
# 운영자가 이슈에서 골라 컨펌하면 그때 구현하는 아이디어 파이프라인.
on:
  schedule:
    - cron: '0 1 * * 1'   # UTC 월 01:00 = KST 월 10:00
  # 스카우트 로직 변경 시 1회 즉시 실행 (게시가 아니라 이슈 제안이라 안전)
  push:
    branches: [main]
    paths:
      - 'scripts/trend_scout.py'
      - '.github/workflows/trend_scout.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: trend-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install anthropic

      - name: Run trend scout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/trend_scout.py

      - name: Open proposal issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK=$(date -d '+9 hours' +%G-W%V)
          FILE="output_enter/trend_scout/${WEEK}.md"
          if [ ! -f "$FILE" ]; then
            echo "제안서 파일 없음(이미 생성됐거나 스킵) — 이슈 생성 생략"; exit 0
          fi
          TITLE="💡 주간 콘텐츠 큐 제안 ${WEEK}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state all \
            --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            echo "이번 주 제안 이슈 #$EXISTING 이미 존재 — 생성 생략"; exit 0
          fi
          gh issue create --repo "${{ github.repository }}" \
            --title "$TITLE" --body-file "$FILE"
          echo "✅ 제안 이슈 생성 완료"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 트렌드 스카우트 실패"
          BODY="[실행 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 확인 필요."
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$(date -u '+%Y-%m-%d %H:%M UTC') 재발 — $BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
